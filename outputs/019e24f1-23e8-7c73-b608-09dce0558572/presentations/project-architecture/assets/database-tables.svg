<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M2,2 L10,6 L2,10 z" fill="#183B56"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
  </filter>
</defs>
<style>
  .title{font:700 40px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#172026}
  .subtitle{font:400 20px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#5E6B73}
  .boxTitle{font:700 22px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif}
  .boxLine{font:400 17px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#5E6B73}
  .group{font:700 17px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#183B56; letter-spacing:.4px}
  .small{font:400 15px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#5E6B73}
  .arrowLabel{font:600 14px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#183B56}
</style>
<rect width="1600" height="900" fill="#F7FAFC"/>
<text x="64" y="66" class="title">数据库表图</text>
<text x="64" y="100" class="subtitle">Prisma/PostgreSQL：13 张业务表按职责域分组</text>
<rect x="64" y="150" width="460" height="242" rx="18" fill="#F1EEFF" stroke="#B7C4CE"/><text x="88" y="192" class="group">认证与用户</text><rect x="84" y="208" width="420" height="76" rx="13" fill="#FFFFFF" stroke="#B7C4CE"/><text x="106" y="238" class="boxTitle" fill="#172026">users</text><text x="106" y="264" class="small">id, email, name, password, email_verified_at</text><rect x="84" y="300" width="420" height="76" rx="13" fill="#FFFFFF" stroke="#B7C4CE"/><text x="106" y="330" class="boxTitle" fill="#172026">email_verification_tokens</text><text x="106" y="356" class="small">email, token, expires_at</text><rect x="64" y="430" width="460" height="334" rx="18" fill="#EAF3FF" stroke="#B7C4CE"/><text x="88" y="472" class="group">视频核心</text><rect x="84" y="488" width="420" height="76" rx="13" fill="#FFFFFF" stroke="#B7C4CE"/><text x="106" y="518" class="boxTitle" fill="#172026">videos</text><text x="106" y="544" class="small">bvid, title, cid, subtitle_text, summary, knowledg</text><text x="106" y="560" class="small">e_extracted</text><rect x="84" y="580" width="420" height="76" rx="13" fill="#FFFFFF" stroke="#B7C4CE"/><text x="106" y="610" class="boxTitle" fill="#172026">user_videos</text><text x="106" y="636" class="small">user_id, video_id, created_at</text><rect x="84" y="672" width="420" height="76" rx="13" fill="#FFFFFF" stroke="#B7C4CE"/><text x="106" y="702" class="boxTitle" fill="#172026">up_profiles</text><text x="106" y="728" class="small">mid, name, face, video_count, last_synced_at</text><rect x="570" y="150" width="460" height="242" rx="18" fill="#EAF7EE" stroke="#B7C4CE"/><text x="594" y="192" class="group">笔记本组织</text><rect x="590" y="208" width="420" height="76" rx="13" fill="#FFFFFF" stroke="#B7C4CE"/><text x="612" y="238" class="boxTitle" fill="#172026">notebooks</text><text x="612" y="264" class="small">user_id, title, tags[], mode, rule, video_count</text><rect x="590" y="300" width="420" height="76" rx="13" fill="#FFFFFF" stroke="#B7C4CE"/><text x="612" y="330" class="boxTitle" fill="#172026">notebook_videos</text><text x="612" y="356" class="small">notebook_id, video_id, notes, order</text><rect x="570" y="430" width="460" height="334" rx="18" fill="#FFF4E5" stroke="#B7C4CE"/><text x="594" y="472" class="group">知识与检索</text><rect x="590" y="488" width="420" height="76" rx="13" fill="#FFFFFF" stroke="#B7C4CE"/><text x="612" y="518" class="boxTitle" fill="#172026">knowledge_points</text><text x="612" y="544" class="small">video_id, type, content, timestamp, metadata</text><rect x="590" y="580" width="420" height="76" rx="13" fill="#FFFFFF" stroke="#B7C4CE"/><text x="612" y="610" class="boxTitle" fill="#172026">embeddings</text><text x="612" y="636" class="small">knowledge_point_id, vector(1024)</text><rect x="590" y="672" width="420" height="76" rx="13" fill="#FFFFFF" stroke="#B7C4CE"/><text x="612" y="702" class="boxTitle" fill="#172026">chat_messages</text><text x="612" y="728" class="small">user_id, video_id, role, content</text><rect x="1076" y="150" width="460" height="334" rx="18" fill="#E7FAF7" stroke="#B7C4CE"/><text x="1100" y="192" class="group">个人化标注</text><rect x="1096" y="208" width="420" height="76" rx="13" fill="#FFFFFF" stroke="#B7C4CE"/><text x="1118" y="238" class="boxTitle" fill="#172026">video_timestamp_notes</text><text x="1118" y="264" class="small">user_id, video_id, timestamp_sec, content</text><rect x="1096" y="300" width="420" height="76" rx="13" fill="#FFFFFF" stroke="#B7C4CE"/><text x="1118" y="330" class="boxTitle" fill="#172026">video_tags</text><text x="1118" y="356" class="small">user_id, name, color</text><rect x="1096" y="392" width="420" height="76" rx="13" fill="#FFFFFF" stroke="#B7C4CE"/><text x="1118" y="422" class="boxTitle" fill="#172026">video_tag_relations</text><text x="1118" y="448" class="small">user_id, video_id, tag_id</text><rect x="64" y="790" width="1458" height="54" rx="16" fill="#FFFFFF" stroke="#B7C4CE"/>
  <text x="92" y="824" class="small">数据模型围绕 users 与 videos 两个主轴展开：用户侧做历史、笔记、标签、聊天隔离；视频侧承载字幕、摘要、知识点与向量检索。</text>
</svg>