<text x="88" y="464" class="boxLine">邮箱密码登录</text>
<text x="88" y="485" class="boxLine">JWT Session</text>
<text x="88" y="506" class="boxLine">邮箱验证 token</text>
  
  <rect x="360" y="390" width="300" height="120" rx="16" fill="#EAF3FF" stroke="#8BBDF7" stroke-width="2"/>
