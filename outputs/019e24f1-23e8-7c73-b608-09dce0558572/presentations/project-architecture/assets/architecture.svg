<text x="1138" y="424" class="boxLine">DashScope/Qwen</text>
<text x="1138" y="445" class="boxLine">DeepSeek/OpenAI/Kim</text>
<text x="1138" y="466" class="boxLine">i</text>
<text x="1138" y="487" class="boxLine">Anthropic/自定义</text>
  
  <rect x="1346" y="350" width="180" height="120" rx="16" fill="#FFFFFF" stroke="#B7C4CE" stroke-width="2"/>
  <text x="1436" y="382" text-anchor="middle" class="boxTitle" fill="#172026">文件系统</text>
<text x="1364" y="424" class="boxLine">/tmp/bilibili-subt</text>
<text x="1364" y="445" class="boxLine">itle</text>
<text x="1364" y="466" class="boxLine">临时音频/SRT</text>
<text x="1364" y="487" class="boxLine">cookie 持久化</text>
  
  <rect x="360" y="610" width="300" height="116" rx="16" fill="#EAF7EE" stroke="#7CCB91" stroke-width="2"/>
  <text x="510" y="642" text-anchor="middle" class="boxTitle" fill="#172026">Search / Knowledge</text>
<text x="378" y="684" class="boxLine">字幕全文检索</text>
<text x="378" y="705" class="boxLine">知识点抽取</text>
<text x="378" y="726" class="boxLine">笔记本聚合</text>
  
  <rect x="750" y="610" width="282" height="116" rx="16" fill="#FFF4E5" stroke="#F2B15F" stroke-width="2"/>
  <text x="891" y="642" text-anchor="middle" class="boxTitle" fill="#172026">Deploy Runtime</text>
<text x="768" y="684" class="boxLine">local Docker build</text>
<text x="768" y="705" class="boxLine">.next/standalone release</text>
<text x="768" y="726" class="boxLine">PM2 + Nginx</text>
  
  <line x1="310" y1="240" x2="360" y2="240" stroke="#183B56" stroke-width="3"  marker-end="url(#arrow)"/>
  <rect x="253" y="214" width="164" height="28" rx="14" fill="#fff" stroke="#B7C4CE"/><text x="335" y="234" text-anchor="middle" class="arrowLabel">HTTP / UI action</text>
  
  <line x1="660" y1="240" x2="750" y2="240" stroke="#183B56" stroke-width="3"  marker-end="url(#arrow)"/>
  <rect x="623" y="214" width="164" height="28" rx="14" fill="#fff" stroke="#B7C4CE"/><text x="705" y="234" text-anchor="middle" class="arrowLabel">route orchestration</text>
  
  <line x1="1032" y1="240" x2="1120" y2="220" stroke="#183B56" stroke-width="3"  marker-end="url(#arrow)"/>
  <rect x="994" y="204" width="164" height="28" rx="14" fill="#fff" stroke="#B7C4CE"/><text x="1076" y="224" text-anchor="middle" class="arrowLabel">fetch metadata</text>
  
  <line x1="660" y1="440" x2="750" y2="440" stroke="#183B56" stroke-width="3"  marker-end="url(#arrow)"/>
  <rect x="623" y="414" width="164" height="28" rx="14" fill="#fff" stroke="#B7C4CE"/><text x="705" y="434" text-anchor="middle" class="arrowLabel">subtitle fallback</text>
  
  <line x1="1032" y1="440" x2="1120" y2="410" stroke="#183B56" stroke-width="3"  marker-end="url(#arrow)"/>
  <rect x="994" y="399" width="164" height="28" rx="14" fill="#fff" stroke="#B7C4CE"/><text x="1076" y="419" text-anchor="middle" class="arrowLabel">LLM stream</text>
  
  <line x1="660" y1="450" x2="1346" y2="220" stroke="#183B56" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <rect x="921" y="309" width="164" height="28" rx="14" fill="#fff" stroke="#B7C4CE"/><text x="1003" y="329" text-anchor="middle" class="arrowLabel">Prisma read/write</text>
  
  <line x1="1032" y1="450" x2="1346" y2="410" stroke="#183B56" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <rect x="1107" y="404" width="164" height="28" rx="14" fill="#fff" stroke="#B7C4CE"/><text x="1189" y="424" text-anchor="middle" class="arrowLabel">temp files</text>
  
  <line x1="660" y1="668" x2="1346" y2="245" stroke="#183B56" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <rect x="921" y="430.5" width="164" height="28" rx="14" fill="#fff" stroke="#B7C4CE"/><text x="1003" y="450.5" text-anchor="middle" class="arrowLabel">knowledge/query data</text>
  <rect x="70" y="790" width="1456" height="54" rx="16" fill="#FFFFFF" stroke="#B7C4CE"/>
  <text x="92" y="824" class="small">核心判断：这是一个 Next.js BFF 型全栈应用，前端体验、API 编排、平台适配、AI 流式能力和 PostgreSQL 知识沉淀都在同一代码库内闭环。</text>
</svg>