<text x="1138" y="234" class="boxLine">B站 API</text>
<text x="1138" y="255" class="boxLine">抖音页面/XHR</text>
<text x="1138" y="276" class="boxLine">小红书链接解析</text>
  
  <rect x="1346" y="160" width="180" height="120" rx="16" fill="#EAF7EE" stroke="#7CCB91" stroke-width="2"/>
