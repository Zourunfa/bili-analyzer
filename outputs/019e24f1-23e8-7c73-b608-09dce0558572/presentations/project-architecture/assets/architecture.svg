<text x="1364" y="234" class="boxLine">Prisma 7</text>
<text x="1364" y="255" class="boxLine">用户/视频/知识库</text>
<text x="1364" y="276" class="boxLine">pgvector embedding</text>
  
  <rect x="70" y="390" width="240" height="120" rx="16" fill="#F1EEFF" stroke="#A99CF0" stroke-width="2"/>
