    <path d="M2,2 L10,6 L2,10 z" fill="#183B56"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
  </filter>
</defs>
<style>
  .title{font:700 40px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#172026}
  .subtitle{font:400 20px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#5E6B73}
  .boxTitle{font:700 22px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif}
  .boxLine{font:400 17px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#5E6B73}
  .group{font:700 17px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#183B56; letter-spacing:.4px}
  .small{font:400 15px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#5E6B73}
  .arrowLabel{font:600 14px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#183B56}
</style>
<rect width="1600" height="900" fill="#F7FAFC"/>
<text x="64" y="66" class="title">项目总体架构图</text>
<text x="64" y="100" class="subtitle">Bilibili Subtitle Analyzer / VideoNote：多平台视频解析、字幕转写、AI 摘要与知识管理</text>

  <text x="80" y="148" class="group">用户与前端体验</text>
  <text x="382" y="148" class="group">Next.js BFF / API Routes</text>
  <text x="780" y="148" class="group">领域服务与任务编排</text>
  <text x="1158" y="148" class="group">外部依赖与持久化</text>
  
  <rect x="70" y="170" width="240" height="142" rx="16" fill="#EAF3FF" stroke="#8BBDF7" stroke-width="2"/>
  <text x="190" y="202" text-anchor="middle" class="boxTitle" fill="#172026">Web Client</text>
<text x="88" y="244" class="boxLine">首页 / 分析页 / 笔记本</text>
<text x="88" y="265" class="boxLine">搜索 / UP 主分析</text>
<text x="88" y="286" class="boxLine">React 19 + Ant Design</text>
  
  <rect x="360" y="170" width="300" height="142" rx="16" fill="#FFFFFF" stroke="#B7C4CE" stroke-width="2"/>
  <text x="510" y="202" text-anchor="middle" class="boxTitle" fill="#172026">API BFF 层</text>
<text x="378" y="244" class="boxLine">/api/video-info</text>
<text x="378" y="265" class="boxLine">/api/subtitle / transcribe</text>
<text x="378" y="286" class="boxLine">/api/summarize / chat</text>
<text x="378" y="307" class="boxLine">/api/videos / notebooks</text>
  
  <rect x="750" y="170" width="282" height="142" rx="16" fill="#E7FAF7" stroke="#72D6CB" stroke-width="2"/>
  <text x="891" y="202" text-anchor="middle" class="boxTitle" fill="#172026">Platform Adapter</text>
<text x="768" y="244" class="boxLine">platform.ts 统一入口</text>
<text x="768" y="265" class="boxLine">bilibili / douyin / xiaohong</text>
<text x="768" y="286" class="boxLine">shu</text>
<text x="768" y="307" class="boxLine">短链解析 + 元信息抓取</text>
  
  <rect x="1120" y="160" width="190" height="120" rx="16" fill="#FFF4E5" stroke="#F2B15F" stroke-width="2"/>
