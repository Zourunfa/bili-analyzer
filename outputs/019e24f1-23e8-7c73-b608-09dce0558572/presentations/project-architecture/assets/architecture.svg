<text x="378" y="464" class="boxLine">Vercel AI SDK streamText</text>
<text x="378" y="485" class="boxLine">摘要 / 对话 / 知识提取</text>
<text x="378" y="506" class="boxLine">模型可配置</text>
  
  <rect x="750" y="390" width="282" height="120" rx="16" fill="#FFFFFF" stroke="#B7C4CE" stroke-width="2"/>
